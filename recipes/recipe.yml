---
name: bazzite-rice
description: Bazzite GNOME + Hyprland (Method B custom image)
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: stable

modules:
  - type: dnf
    repos:
      copr:
        - nett00n/hyprland
        # solopasha/hyprland for the live-wallpaper stack and nwg-look.
        - solopasha/hyprland
        # ilyaz/LACT — Linux GPU Control Application (fan curves, clocks, power).
        - ilyaz/LACT
    install:
      packages:
        - hyprland
        - xdg-desktop-portal-hyprland
        # GUI helpers for Hyprland (hyprland-guiutils: hyprland-dialog etc.)
        - hyprland-guiutils
        # Wallpaper daemon: swww (better-behaved than hyprpaper v0.8.4 and
        # supports per-monitor unload, which mpvpaper relies on).
        - swww
        - hyprlock
        - hypridle
        - hyprpicker
        - hyprshot
        - hyprcursor
        - waybar
        # rofi 2.x is wayland-native; "rofi-wayland" is a retired name that
        # only resolves through a compat Provides.
        - rofi
        - SwayNotificationCenter
        - wlogout
        - grim
        - slurp
        - cliphist
        - kitty
        - zsh
        # LuaJIT runs the rice's scripting layer (dotfiles/hypr/*.lua,
        # dotfiles/waybar/scripts/*.lua). Declared explicitly: nothing else
        # in the image guarantees it.
        - luajit
        - jetbrains-mono-fonts
        # --- GUI helpers (auth dialogs, audio/network/bluetooth tray, Qt theming) ---
        - hyprpolkitagent
        - pavucontrol
        - network-manager-applet
        - blueman
        - qt6ct
        - kvantum
        - nwg-look
        # Icon theme referenced by rofi (icon-theme: "Papirus-Dark").
        - papirus-icon-theme
        # --- Live wallpaper stack ---
        # mpvpaper plays videos as wallpapers; waypaper is a GUI picker that
        # drives mpvpaper/hyprpaper/swww. mpv is the video backend mpvpaper needs.
        - mpvpaper
        - waypaper
        - mpv
        # --- GPU control ---
        # LACT exposes fan/clock/power controls via a privileged daemon;
        # the GUI talks to lactd over a socket.
        - lact

  - type: systemd
    system:
      enabled:
        - lactd.service

  - type: signing
