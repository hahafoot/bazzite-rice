# Disable the Blue Yeti's phantom IEC958 (S/PDIF) playback sink.
#
# The Yeti microphone advertises a digital "Blue Microphones Digital Stereo
# (IEC958)" output that isn't wired to any speaker/headphone. WirePlumber would
# periodically auto-select it as the default sink (e.g. after a plug/unplug or
# reboot), silently swallowing all audio. Disabling the node removes it as a
# candidate entirely; the Yeti's microphone (source) is unaffected.
#
# Matched by regex on node.name so it survives a different unit / serial number.

monitor.alsa.rules = [
  {
    matches = [
      { node.name = "~alsa_output.usb-Generic_Blue_Microphones.*iec958.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
