general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock BEFORE blanking the displays. hyprlock's `path = screenshot` grabs the
# screen when it starts, so if dpms turned the panels off first it would
# capture (and blur) a black frame -> black lock screen. Lock at 300s, then
# blank 30s later once hyprlock already holds its screenshot.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1800
    on-timeout = systemctl suspend
}

