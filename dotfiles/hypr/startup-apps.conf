# Apps launched on Hyprland startup.
#
# Format:  <state>|<name>|<command>
#   state    on  = launch at startup
#            off = skip
#   name     short identifier shown in the toggle menu (lowercase, no spaces).
#            Also used as the process-match pattern for "is it running?" and
#            "kill it" (pgrep -if / pkill -if). Pick something that appears
#            in the running process's argv -- e.g. `spotify` matches
#            `com.spotify.Client`.
#   command  shell command, run detached at startup.
#
# Edit this file directly, or use SUPER+SHIFT+A for a rofi menu -- selecting an
# entry REMOVES it (and kills the app); "+ add new app..." appends a new entry
# and launches it. (The off state is still honored for hand-edited entries.)

on|spotify|flatpak run com.spotify.Client
on|steam|steam -silent
on|vesktop|flatpak run dev.vencord.Vesktop
