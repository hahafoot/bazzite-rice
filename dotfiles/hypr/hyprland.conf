# ---- Monitors ----
# Monitor layout lives in monitors.conf and is edited graphically with the
# arranger (SUPER+SHIFT+D). Use `hyprctl monitors` to find connector names.
source = ~/.config/hypr/monitors.conf

# ---- Wayland / portal env (needed for screen share, file pickers, etc.) ----
# 1. Push env into systemd/dbus so portals dbus-activated later see the right
#    XDG_CURRENT_DESKTOP and pick the hyprland backend.
# 2. Start hyprland-session.target -- via BindsTo it brings up
#    graphical-session.target, which xdg-desktop-portal.service requires
#    (Requisite=graphical-session.target). Without this the main portal
#    fails to start and screen sharing breaks.
# 3. Stop any portals that autostarted before env was set, then explicitly
#    start the hyprland portal.
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = systemctl --user start hyprland-session.target
exec-once = systemctl --user stop xdg-desktop-portal xdg-desktop-portal-hyprland xdg-desktop-portal-gnome xdg-desktop-portal-gtk
exec-once = sleep 1 && systemctl --user start xdg-desktop-portal-hyprland xdg-desktop-portal.service

# ---- Autostart ----
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar &
# Wallpaper backend is swww (image daemon) + mpvpaper (live wallpapers for
# .mp4/.webm/.mkv/.mov). The cycler script handles both transparently.
exec-once = swww-daemon &
exec-once = sleep 1 && ~/.config/hypr/cycle-wallpaper.lua init
exec-once = hypridle &
exec-once = wl-paste --watch cliphist store &
exec-once = swaync &
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = ~/.config/hypr/workspace-watcher.lua &
# Per-user startup apps -- list lives in ~/.config/hypr/startup-apps.conf,
# toggled at runtime with SUPER+SHIFT+A.
exec-once = ~/.config/hypr/startup-apps.lua

# ---- Look & feel ----
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(ffa7b9ee) rgba(ffa7b9ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

decoration {
    rounding = 16
    blur {
        enabled = true
        size = 2
        passes = 1
        new_optimizations = true
    }
    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000044)
    }
    active_opacity = 1.0
    inactive_opacity = 0.92
}

animations {
    enabled = true
    bezier = smooth, 0.05, 0.9, 0.1, 1.0
    animation = windows, 1, 5, smooth
    animation = windowsOut, 1, 5, smooth, popin 80%
    animation = fade, 1, 6, smooth
    animation = workspaces, 1, 5, smooth, slide
    animation = border, 1, 8, smooth
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    # touchpad { natural_scroll = true }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Keep logging on so config-load failures are diagnosable. Without this,
# Hyprland silences stdout/logfile shortly after startup ("Disabling stdout logs!"),
# making it impossible to see why a reload or config silently reverts to defaults.
debug {
    disable_logs = false
}

# ---- Keybinds ----
$mod = SUPER
bind = $mod, RETURN, exec, kitty
bind = $mod SHIFT, RETURN, exec, ~/.config/hypr/open-terminal-here.py   # kitty in the focused Nautilus folder (else plain kitty)
bind = $mod, Q, killactive,
bind = $mod, E, exec, nautilus
bind = $mod, SPACE, exec, rofi -show drun
bind = $mod, F, fullscreen,
bind = $mod, V, togglefloating,
bind = $mod, L, exec, hyprlock
bind = $mod SHIFT, S, exec, hyprshot -m region
bind = $mod, ESCAPE, exec, wlogout
bind = $mod, G,      exec, steam
bind = $mod, backslash, exec, kitty --class=keybinds-cheatsheet -- less ~/.config/hypr/keybinds.txt
bind = $mod SHIFT, B, exec, killall waybar; sleep 0.2 && waybar &
bind = $mod SHIFT, R, exec, ~/.config/hypr/reload-watcher.lua
bind = $mod CTRL SHIFT, R, exec, hyprctl reload   # re-apply hyprland.conf if it ever drops to defaults
bind = $mod SHIFT, P, exec, waypaper   # GUI wallpaper picker
bind = $mod SHIFT, A, exec, ~/.config/hypr/toggle-startup-apps.lua   # manage startup apps (add/remove)
bind = $mod SHIFT, D, exec, ~/.config/hypr/monitor-arranger.py      # GUI monitor arranger

# Wallpaper picker -- terminal fzf UI with image previews (kitty + kitten icat).
# Enter applies to all monitors; Alt-1 / Alt-2 target DP-1 / DP-2 individually.
# Drop images into <repo>/wallpapers/ (recursive).
bind = $mod, W, exec, ~/.config/hypr/pick-wallpaper.lua

# Session exit (panic bind in case Hyprland is misbehaving)
bind = $mod SHIFT, M, exit,

# Screenshots
bind = , Print,          exec, hyprshot -m output
bind = $mod, Print,      exec, hyprshot -m active
bind = $mod SHIFT, Print, exec, hyprshot -m region

# Clipboard history (cliphist is already storing via autostart)
bind = $mod, C, exec, cliphist list | rofi -dmenu -p clip | cliphist decode | wl-copy

# Media / volume keys (pipewire via wpctl, MPRIS via playerctl)
#   bindel = repeats while held + still fires when the screen is locked
#   bindl  = fires when locked (no repeat — toggles/transport don't want autorepeat)
# Raising/lowering volume also unmutes, matching GNOME/most desktops.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ 0 && wpctl set-volume         @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioMicMute,     exec, wpctl set-mute   @DEFAULT_AUDIO_SOURCE@ toggle
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioPause,       exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous
bindl  = , XF86AudioStop,        exec, playerctl stop

# Brightness (external monitors over DDC/CI via ddcutil — no internal backlight).
# Bound to SUPER +/- since this keyboard has no dedicated brightness keys; the
# XF86 keysyms are kept too in case a keyboard that has them is plugged in.
# binde = repeats while held.
bindel = , XF86MonBrightnessUp,   exec, ~/.config/hypr/brightness.sh up
bindel = , XF86MonBrightnessDown, exec, ~/.config/hypr/brightness.sh down
binde = $mod, equal, exec, ~/.config/hypr/brightness.sh up
binde = $mod, minus, exec, ~/.config/hypr/brightness.sh down

# Mouse drag to move/resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Blur the waybar layer so semi-transparent modules pick up the backdrop
layerrule {
    name = waybar-blur
    match:namespace = ^(primary|secondary)$

    blur        = true
    ignore_alpha = 0.1
}

# Make the cheatsheet open as a centered floating window
windowrule {
    name = cheatsheet-float
    match:class = ^(keybinds-cheatsheet)$

    float  = true
    size   = 720 720
    center = true
}

# Same for the wallpaper picker
windowrule {
    name = wallpaper-picker-float
    match:class = ^(wallpaper-picker)$

    float  = true
    size   = 1280 720
    center = true
}

# Workspace assignments are handled by ~/.config/hypr/workspace-watcher.lua
# (started from autostart further up). It watches Hyprland's event socket
# and dispatches movetoworkspacesilent when matching windows open.
# Rule table lives inside that script — edit there to add/change.

# Move focus / workspaces
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Swap the workspaces on the two monitors (Dell DP-2 ↔ AOC DP-1)
bind = $mod, O, swapactiveworkspaces, DP-1 DP-2
