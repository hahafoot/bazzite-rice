# Use the recipe-provided zsh (always present on the image). ~/.zshrc still
# loads brew's shellenv, so brew tools stay on PATH inside the shell.
shell /usr/bin/zsh --login

# Translucent background. Lower = more see-through. Wayland/Hyprland honors it.
background_opacity 0.75
# Lets you adjust live with Ctrl+Shift+A then m (more), l (less), 1 (full), d (default).
dynamic_background_opacity yes
