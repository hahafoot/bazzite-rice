name: build-bazzite-rice
on:
  schedule:
    - cron: "05 10 * * *"
  push:
    branches: [main]
    # The image only ships binaries; dotfiles/ and wallpapers/ are applied at
    # runtime by install.sh and are never baked in, so changing them shouldn't
    # trigger a full image rebuild + publish.
    paths-ignore:
      - "**.md"
      - "dotfiles/**"
      - "wallpapers/**"
  workflow_dispatch:

# Don't let overlapping runs race each other pushing :latest.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: blue-build/github-action@v1.11
        with:
          recipe: recipe.yml
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
